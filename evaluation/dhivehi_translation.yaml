task: dhivehi_translation
dataset_path: ubaidhullah05/dhivehi-bench
dataset_name: translation
output_type: generate_until
training_split: null
test_split: train
doc_to_text: "Translate the following English sentence to Dhivehi:\n\nEnglish: {{translation.en}}\nDhivehi:"
doc_to_target: "{{translation.dv}}"
generation_kwargs:
  until:
    - "\n"
    - "English:"
  max_gen_toks: 128
  temperature: 0.0
metric_list:
  - metric: chrf
    aggregation: mean
    higher_is_better: true
  - metric: bleu
    aggregation: mean
    higher_is_better: true
