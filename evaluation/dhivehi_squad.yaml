task: dhivehi_squad
dataset_path: ubaidhullah05/dhivehi-bench
dataset_name: squad
output_type: generate_until
training_split: null
test_split: train
doc_to_text: "Read the following Dhivehi paragraph and answer the question based strictly on the text.\n\nParagraph:\n{{context}}\n\nQuestion: {{question}}\nAnswer:"
doc_to_target: "{{answer}}"
generation_kwargs:
  until:
    - "\n"
    - "Question:"
  max_gen_toks: 64
  temperature: 0.0
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: rougeL
    aggregation: mean
    higher_is_better: true
